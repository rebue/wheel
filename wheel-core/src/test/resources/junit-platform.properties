# 启用并行执行
junit.jupiter.execution.parallel.enabled = true
# 设置执行的并行模式为并发
# 如果不设置，默认为same_thread，即测试类和测试方法按顺序执行
# 可在单独的测试方法上加上@Execution(ExecutionMode.CONCURRENT)以单独让此方法并发执行
junit.jupiter.execution.parallel.mode.default = concurrent
# 设置最大并行线程数
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 2000